<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR SmartTec | Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel {
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(188, 19, 254, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #00f3ff;
            font-family: 'Orbitron', sans-serif;
        }
        .sync-dot {
            width: 6px;
            height: 6px;
            background: #00f3ff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="glass-panel sticky top-0 z-50 w-full border-b border-[#bc13fe]/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3">
                    <span class="px-3 py-1 bg-[#bc13fe]/20 border border-[#bc13fe] text-[#bc13fe] text-xs font-orbitron rounded uppercase tracking-wider">ADMIN</span>
                    <h1 class="text-2xl font-orbitron font-bold tracking-wider text-white">JR <span class="text-[#bc13fe]">SmartTec</span></h1>
                </div>
                <div class="flex items-center gap-4">
                    <div class="sync-badge">
                        <div class="sync-dot"></div>
                        <span>FIREBASE LIVE</span>
                    </div>
                    <a href="./index.html" target="_blank" class="text-sm font-orbitron text-gray-300 hover:text-[#00f3ff] transition-colors border border-gray-700 hover:border-[#00f3ff] px-4 py-2 rounded flex items-center gap-2">
                        🛍️ Ver Tienda
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="glass-panel p-6 rounded-xl border-l-4 border-[#00f3ff]">
                <p class="text-gray-400 font-orbitron text-xs">PRODUCTOS</p>
                <h3 id="stat-total" class="text-3xl font-orbitron font-bold text-white mt-1">0</h3>
            </div>
            <div class="glass-panel p-6 rounded-xl border-l-4 border-[#bc13fe]">
                <p class="text-gray-400 font-orbitron text-xs">VALOR TOTAL</p>
                <h3 id="stat-value" class="text-3xl font-orbitron font-bold text-white mt-1">$0.00</h3>
            </div>
            <div class="glass-panel p-6 rounded-xl border-l-4 border-yellow-500">
                <p class="text-gray-400 font-orbitron text-xs">BAJO STOCK</p>
                <h3 id="stat-low" class="text-3xl font-orbitron font-bold text-white mt-1">0</h3>
            </div>
        </div>

        <div class="glass-panel rounded-2xl overflow-hidden p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-orbitron font-bold text-white">INVENTARIO</h2>
                    <p class="text-gray-400 text-sm">Administra productos en tiempo real con Firebase</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="openAddModal()" class="bg-[#bc13fe] text-white font-orbitron font-bold px-5 py-2.5 rounded hover:bg-white hover:text-black transition-all flex items-center gap-2">
                        ➕ NUEVO
                    </button>
                    <button onclick="exportData()" class="bg-gray-700 text-white font-orbitron font-bold px-5 py-2.5 rounded hover:bg-gray-600 transition-all">
                        ⬇️ EXPORT
                    </button>
                    <button onclick="document.getElementById('import-file').click()" class="bg-gray-700 text-white font-orbitron font-bold px-5 py-2.5 rounded hover:bg-gray-600 transition-all">
                        ⬆️ IMPORT
                    </button>
                    <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importFromFile(event)">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-gray-400 font-orbitron text-xs">
                            <th class="p-4">PRODUCTO</th>
                            <th class="p-4">CATEGORÍA</th>
                            <th class="p-4 text-right">PRECIO</th>
                            <th class="p-4 text-center">STOCK</th>
                            <th class="p-4 text-right">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table" class="divide-y divide-gray-800 text-sm">
                        <tr><td colspan="5" class="text-center p-4 text-gray-400 font-orbitron">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="product-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-xl rounded-2xl p-6 md:p-8 border border-[#bc13fe]/40">
            <h3 id="modal-title" class="text-xl font-orbitron font-bold text-white mb-6">Agregar Nuevo Producto</h3>
            <form id="product-form" class="space-y-4">
                <input type="hidden" id="form-action" value="add">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="p-id" placeholder="ID (ej: prod_1)" required class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-[#bc13fe]">
                    <select id="p-cat" class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-[#bc13fe]">
                        <option value="AUDÍFONOS">AUDÍFONOS</option>
                        <option value="CARGADORES">CARGADORES</option>
                        <option value="ACCESORIOS">ACCESORIOS</option>
                    </select>
                </div>
                <input type="text" id="p-name" placeholder="Nombre" required class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-[#bc13fe]">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="number" step="0.01" id="p-price" placeholder="Precio" required class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-[#bc13fe]">
                    <input type="number" id="p-stock" placeholder="Stock" required min="0" class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-[#bc13fe]">
                </div>
                <input type="url" id="p-img" placeholder="URL imagen" class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-[#bc13fe]">
                <textarea id="p-desc" placeholder="Descripción" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-[#bc13fe]"></textarea>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-[#bc13fe] text-white font-orbitron font-bold py-2.5 rounded hover:bg-white hover:text-black transition-all">
                        GUARDAR
                    </button>
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-700 text-white font-orbitron font-bold py-2.5 rounded hover:bg-gray-600 transition-all">
                        CANCELAR
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] space-y-3"></div>

    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js"></script>

    <!-- Nuestro script -->
    <script src="./firebase-shared-WORKING.js"></script>

    <script>
        async function renderTable() {
            const tbody = document.getElementById('inventory-table');
            if (!window.productManager) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-gray-400 font-orbitron">Esperando Firebase...</td></tr>';
                return;
            }

            const products = window.productManager.getAll();
            
            tbody.innerHTML = '';
            for (let id in products) {
                const prod = products[id];
                const stockColor = prod.stock < 10 ? 'text-yellow-400 font-bold' : 'text-white';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-900/50 transition-colors">
                        <td class="p-4">
                            <div>
                                <p class="font-bold text-white font-orbitron">${prod.name}</p>
                                <p class="text-xs text-gray-400">ID: ${id}</p>
                            </div>
                        </td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded bg-[#bc13fe]/10 border border-[#bc13fe]/30 text-[#bc13fe] text-xs font-orbitron">${prod.cat}</span></td>
                        <td class="p-4 text-right font-orbitron font-bold text-[#00f3ff]">$${prod.price.toFixed(2)}</td>
                        <td class="p-4 text-center ${stockColor} font-orbitron">${prod.stock}</td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="editProduct('${id}')" class="text-gray-400 hover:text-[#00f3ff] p-1 transition-colors">✏️</button>
                            <button onclick="confirmDelete('${id}')" class="text-gray-400 hover:text-red-500 p-1 transition-colors">🗑️</button>
                        </td>
                    </tr>
                `;
            }
        }

        function updateStats() {
            if (!window.productManager) return;
            const products = window.productManager.getAll();
            let totalProds = Object.keys(products).length;
            let totalValue = 0;
            let lowStock = 0;

            for (let id in products) {
                totalValue += products[id].price * products[id].stock;
                if (products[id].stock < 10) lowStock++;
            }

            document.getElementById('stat-total').innerText = totalProds;
            document.getElementById('stat-value').innerText = '$' + totalValue.toFixed(2);
            document.getElementById('stat-low').innerText = lowStock;
        }

        function openAddModal() {
            document.getElementById('form-action').value = 'add';
            document.getElementById('modal-title').innerText = 'Agregar Nuevo Producto';
            document.getElementById('product-form').reset();
            document.getElementById('p-id').readOnly = false;
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function editProduct(id) {
            if (!window.productManager) return;
            const prod = window.productManager.getById(id);
            if (!prod) return;

            document.getElementById('p-id').value = id;
            document.getElementById('p-id').readOnly = true;
            document.getElementById('p-name').value = prod.name;
            document.getElementById('p-cat').value = prod.cat;
            document.getElementById('p-price').value = prod.price;
            document.getElementById('p-stock').value = prod.stock;
            document.getElementById('p-img').value = prod.img || '';
            document.getElementById('p-desc').value = prod.desc || '';
            
            document.getElementById('form-action').value = 'edit';
            document.getElementById('modal-title').innerText = 'Editar Producto';
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function confirmDelete(id) {
            if (confirm('¿Eliminar este producto?')) {
                if (window.productManager) {
                    window.productManager.deleteProduct(id).then(() => {
                        showToast('Producto eliminado');
                    }).catch(err => showToast('Error: ' + err.message));
                }
            }
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!window.productManager) {
                showToast('Firebase no está listo');
                return;
            }

            const action = document.getElementById('form-action').value;
            const id = document.getElementById('p-id').value;

            const productData = {
                name: document.getElementById('p-name').value,
                cat: document.getElementById('p-cat').value,
                price: parseFloat(document.getElementById('p-price').value),
                stock: parseInt(document.getElementById('p-stock').value),
                img: document.getElementById('p-img').value || 'https://via.placeholder.com/300x300?text=Producto',
                desc: document.getElementById('p-desc').value,
                specs: ['Especificación genérica']
            };

            try {
                if (action === 'add') {
                    await window.productManager.addProduct(id, productData);
                    showToast('Producto agregado');
                } else {
                    await window.productManager.updateProduct(id, productData);
                    showToast('Producto actualizado');
                }
                closeModal();
            } catch (error) {
                showToast('Error: ' + error.message);
            }
        });

        function exportData() {
            if (window.productManager) {
                window.productManager.exportAsJSON();
                showToast('Descargando respaldo...');
            }
        }

        async function importFromFile(event) {
            const file = event.target.files[0];
            if (!file || !window.productManager) return;

            try {
                await window.productManager.importFromFile(file);
                showToast('Datos importados correctamente');
                event.target.value = '';
            } catch (error) {
                showToast('Error: ' + error.message);
            }
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900 border-l-4 border-[#bc13fe] text-white p-4 rounded shadow-lg flex items-center gap-3 font-orbitron text-xs';
            toast.innerHTML = `ℹ️ ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Esperar a que ProductManager esté listo
        const checkProductManager = setInterval(() => {
            if (window.productManager) {
                window.productManager.onChange(() => {
                    renderTable();
                    updateStats();
                });
                renderTable();
                updateStats();
                clearInterval(checkProductManager);
                showToast('Conectado a Firebase ✅');
            }
        }, 100);
    </script>
</body>
</html>
