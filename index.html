<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR SmartTec | Tecnología Futurista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: #ffffff;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(15, 15, 20, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-panel:hover {
            border-color: rgba(188, 19, 254, 0.4);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
        }

        .sync-indicator {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 8px 16px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            color: #00f3ff;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            background: #00f3ff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .toast-msg {
            background: rgba(15, 15, 20, 0.95);
            border-left: 4px solid var(--neon-cyan);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 4px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.875rem;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
        }
        .toast-msg.show {
            transform: translateX(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="sync-indicator">
        <div class="sync-dot"></div>
        <span>FIREBASE SINCRONIZADO</span>
    </div>

    <nav class="glass-panel sticky top-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex-shrink-0 cursor-pointer group" onclick="showSection('home')">
                    <h1 class="text-2xl md:text-3xl font-orbitron font-bold tracking-wider">
                        <span class="text-white">JR</span> 
                        <span class="text-[#00f3ff] group-hover:text-[#bc13fe] transition-colors duration-300">SmartTec</span>
                    </h1>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <button onclick="showSection('home')" class="text-gray-300 hover:text-[#00f3ff] px-3 py-2 rounded-md text-sm font-medium font-orbitron transition-all">INICIO</button>
                        <button onclick="showSection('products')" class="text-gray-300 hover:text-[#00f3ff] px-3 py-2 rounded-md text-sm font-medium font-orbitron transition-all">PRODUCTOS</button>
                    </div>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <button onclick="toggleCart()" class="text-[#00f3ff] hover:text-[#bc13fe] transition-colors relative p-2">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span id="cart-count" class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-[10px] font-bold leading-none text-black bg-[#00f3ff] rounded-full transform translate-x-1/4 -translate-y-1/4">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <section id="section-home" class="page-section">
            <div class="flex flex-col lg:flex-row items-center justify-between gap-12 mt-8">
                <div class="lg:w-1/2 space-y-6">
                    <div class="inline-block px-3 py-1 rounded-full border border-[#bc13fe] text-[#bc13fe] text-xs font-orbitron tracking-widest uppercase bg-[#bc13fe]/10">
                        Siguiente Generación
                    </div>
                    <h2 class="text-5xl md:text-6xl font-orbitron font-bold leading-tight">
                        Eleva tu <br>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00f3ff] to-[#bc13fe]">Experiencia Móvil</span>
                    </h2>
                    <p class="text-gray-400 text-lg md:text-xl max-w-lg">
                        En JR SmartTec traemos el futuro a tus manos. Descubre nuestra colección de accesorios de alta tecnología.
                    </p>
                    <button onclick="showSection('products')" class="bg-[#00f3ff] text-black font-orbitron font-bold py-3 px-8 rounded hover:bg-white transition-all">
                        VER CATÁLOGO
                    </button>
                </div>
            </div>
        </section>

        <section id="section-products" class="page-section hidden">
            <h2 class="text-4xl md:text-5xl font-orbitron font-bold mb-12 text-center">
                Catálogo de <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00f3ff] to-[#bc13fe]">Productos</span>
            </h2>

            <div class="flex gap-3 mb-10 flex-wrap justify-center">
                <button onclick="filterCategory('TODOS')" class="category-filter active px-4 py-2 rounded-full border border-[#00f3ff] text-[#00f3ff] font-orbitron text-sm hover:bg-[#00f3ff]/10 transition-all" data-category="TODOS">
                    TODOS
                </button>
                <button onclick="filterCategory('AUDÍFONOS')" class="category-filter px-4 py-2 rounded-full border border-gray-600 text-gray-400 font-orbitron text-sm hover:border-[#bc13fe] hover:text-[#bc13fe] transition-all" data-category="AUDÍFONOS">
                    AUDÍFONOS
                </button>
                <button onclick="filterCategory('CARGADORES')" class="category-filter px-4 py-2 rounded-full border border-gray-600 text-gray-400 font-orbitron text-sm hover:border-[#bc13fe] hover:text-[#bc13fe] transition-all" data-category="CARGADORES">
                    CARGADORES
                </button>
                <button onclick="filterCategory('ACCESORIOS')" class="category-filter px-4 py-2 rounded-full border border-gray-600 text-gray-400 font-orbitron text-sm hover:border-[#bc13fe] hover:text-[#bc13fe] transition-all" data-category="ACCESORIOS">
                    ACCESORIOS
                </button>
            </div>

            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center text-gray-400 py-12">
                    <p class="font-orbitron">Cargando productos...</p>
                </div>
            </div>
        </section>
    </main>

    <div id="cart-overlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-[60]" onclick="toggleCart()"></div>
    <div id="cart-panel" class="fixed right-0 top-0 w-96 h-screen bg-[#050505] border-l border-[#00f3ff]/20 translate-x-full transition-transform duration-300 z-[65] flex flex-col">
        <div class="flex items-center justify-between p-6 border-b border-[#00f3ff]/20">
            <h2 class="text-2xl font-orbitron font-bold">CARRITO</h2>
            <button onclick="toggleCart()" class="text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-4"></div>
        <div class="border-t border-[#00f3ff]/20 p-6 space-y-4">
            <div class="flex justify-between text-lg font-orbitron font-bold">
                <span>Total:</span>
                <span id="cart-total" class="text-[#00f3ff]">$0.00</span>
            </div>
            <button onclick="checkoutCart()" class="w-full bg-[#00f3ff] text-black font-orbitron font-bold py-3 rounded hover:bg-white transition-all">
                PROCESAR COMPRA
            </button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- Firebase CDN - jsDelivr (más confiable que gstatic) -->
    
    
    
    <!-- Nuestro script -->
    <script src="./firebase-rest-api.js"></script>

    <script>
        let currentFilter = 'TODOS';
        let cart = [];

        function showSection(sectionName) {
            document.querySelectorAll('.page-section').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(`section-${sectionName}`).classList.remove('hidden');
        }

        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.category-filter').forEach(btn => {
                btn.classList.remove('active', 'border-[#00f3ff]', 'text-[#00f3ff]');
                btn.classList.add('border-gray-600', 'text-gray-400');
            });
            document.querySelector(`[data-category="${category}"]`).classList.add('active', 'border-[#00f3ff]', 'text-[#00f3ff]');
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-grid');
            if (!window.productManager) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-12"><p class="font-orbitron">Esperando Firebase...</p></div>';
                return;
            }

            const allProducts = window.productManager.getAll();
            let products = Object.values(allProducts);
            
            if (currentFilter !== 'TODOS') {
                products = products.filter(p => p.cat === currentFilter);
            }

            if (products.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-12"><p class="font-orbitron">No hay productos disponibles</p></div>';
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="glass-panel p-6 rounded-xl cursor-pointer group hover:border-[#bc13fe] transition-all">
                    <div class="relative overflow-hidden rounded-lg mb-4 h-48 bg-gray-900">
                        <img src="${product.img}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <p class="text-[#bc13fe] font-orbitron text-xs mb-2 uppercase tracking-widest">${product.cat}</p>
                    <h3 class="text-white font-orbitron font-bold mb-2">${product.name}</h3>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-2">${product.desc}</p>
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[#00f3ff] font-orbitron font-bold">$${product.price.toFixed(2)}</span>
                        <span class="text-xs font-orbitron text-gray-400">${product.stock > 0 ? `${product.stock} disponibles` : 'Agotado'}</span>
                    </div>
                    <button onclick="addToCart('${product.id}')" class="w-full bg-[#00f3ff] text-black font-orbitron font-bold py-2 rounded hover:bg-white transition-all">
                        AGREGAR
                    </button>
                </div>
            `).join('');
        }

        function addToCart(productId, quantity = 1) {
            if (!window.productManager) return;
            const product = window.productManager.getById(productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({ id: productId, name: product.name, price: product.price, quantity: quantity });
            }
            
            updateCartUI();
            showToast(`${product.name} agregado al carrito`);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const count = document.getElementById('cart-count');
            const itemsContainer = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            count.innerText = totalItems;
            
            if (cart.length === 0) {
                itemsContainer.innerHTML = `<div class="flex flex-col items-center justify-center h-full opacity-50"><p class="text-gray-400 text-center font-orbitron">No hay productos</p></div>`;
                totalEl.innerText = '$0.00';
                return;
            }
            
            let html = '';
            let total = 0;
            
            cart.forEach((item, index) => {
                total += (item.price * item.quantity);
                html += `
                    <div class="flex justify-between items-center bg-gray-900/40 p-4 rounded-lg border border-gray-800">
                        <div>
                            <p class="text-white font-orbitron text-sm">${item.name} <span class="text-gray-500 text-xs ml-2">x${item.quantity}</span></p>
                            <p class="text-[#00f3ff] text-sm font-bold mt-1">$${(item.price * item.quantity).toFixed(2)}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-gray-500 hover:text-red-500 transition-colors p-2">
                            🗑️
                        </button>
                    </div>
                `;
            });
            
            itemsContainer.innerHTML = html;
            totalEl.innerText = '$' + total.toFixed(2);
        }

        function toggleCart() {
            const overlay = document.getElementById('cart-overlay');
            const panel = document.getElementById('cart-panel');
            
            if (panel.classList.contains('translate-x-full')) {
                overlay.classList.remove('hidden');
                panel.classList.remove('translate-x-full');
            } else {
                overlay.classList.add('hidden');
                panel.classList.add('translate-x-full');
            }
        }

        function checkoutCart() {
            if(cart.length === 0) return;
            cart = [];
            updateCartUI();
            showToast('¡Compra realizada exitosamente!');
            setTimeout(() => toggleCart(), 2000);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = `<svg class="w-5 h-5 text-[#00f3ff] mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Suscribirse a cambios
        const checkProductManager = setInterval(() => {
            if (window.productManager) {
                window.productManager.onChange((products) => {
                    if (!document.getElementById('section-products').classList.contains('hidden')) {
                        renderProducts();
                    }
                });
                renderProducts();
                clearInterval(checkProductManager);
            }
        }, 100);

        // Inicializar
        window.onload = async function() {
            showSection('home');
            setTimeout(() => renderProducts(), 2000);
        };
    </script>
</body>
</html>
